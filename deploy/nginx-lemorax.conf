server {
    listen 80;
    server_name lemorax.indonesiabelajarai.com;

    # Redirect HTTP to HTTPS
    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name lemorax.indonesiabelajarai.com;

    client_max_body_size 50M;

    # SSL certificates (update paths for your VPS / Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/lemorax.indonesiabelajarai.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/lemorax.indonesiabelajarai.com/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }
}
